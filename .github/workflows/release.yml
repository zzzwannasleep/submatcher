name: Release

# Run workflow = release. Version: v0.1.0 first, then +0.0.1. Push a tag (e.g. v0.2.0) to jump.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, so two runs can't claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the tags
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ -z "$last" ]]; then tag=v0.1.0
            else IFS=. read -r major minor patch <<< "${last#v}"; tag="v$major.$minor.$((patch + 1))"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::版本 $tag"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          echo "NAME=SubMatcher-$TAG-$RID" >> "$GITHUB_ENV"
          sh publish.sh "$RID" "${TAG#v}"
          cp README.md "publish/$RID/"

      - name: Smoke test CLI
        if: matrix.rid != 'osx-x64' # cross-built on an arm64 runner
        run: publish/$RID/submatcher-cli* --help | head -1

      - name: Zip (without ffmpeg)
        run: |
          mkdir -p dist
          # Pack from inside the folder so the zip extracts to SubMatcher-…/ with everything portable inside.
          mv "publish/$RID" "publish/$NAME"
          if [[ "$RID" == win-* ]]; then (cd publish && 7z a -tzip "../dist/$NAME.zip" "$NAME" >/dev/null)
          else (cd publish && zip -qry "../dist/$NAME.zip" "$NAME"); fi
          mv "publish/$NAME" "publish/$RID"

      - name: Fetch latest stable ffmpeg
        run: |
          DIR="publish/$RID"
          mkdir -p ff
          case "$RID" in
            win-x64|linux-x64)
              # BtbN static GPL builds; pick the highest stable release branch (ffmpeg-nX.Y-latest-…).
              plat=$([[ "$RID" == win-x64 ]] && echo win64 || echo linux64)
              asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
                | grep -E "^ffmpeg-n[0-9.]+-latest-$plat-gpl-[0-9.]+\.(zip|tar\.xz)$" | sort -V | tail -1)
              echo "using $asset"
              gh release download latest -R BtbN/FFmpeg-Builds -p "$asset" -D ff
              if [[ "$asset" == *.zip ]]; then 7z x "ff/$asset" -o./ff >/dev/null; else tar -xJf "ff/$asset" -C ff; fi
              cp ff/ffmpeg-*/bin/ffmpeg* ff/ffmpeg-*/bin/ffprobe* "$DIR/"
              cp ff/ffmpeg-*/LICENSE.txt "$DIR/FFMPEG-LICENSE.txt"
              src="https://github.com/BtbN/FFmpeg-Builds ($asset)"
              ;;
            osx-*)
              # martin-riedl.de static builds (BtbN has no macOS).
              arch=$([[ "$RID" == osx-arm64 ]] && echo arm64 || echo amd64)
              for b in ffmpeg ffprobe; do
                url=$(curl -fsSL -o "ff/$b.zip" -w "%{url_effective}" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$b.zip")
                unzip -o -q "ff/$b.zip" -d "$DIR"
              done
              chmod +x "$DIR/ffmpeg" "$DIR/ffprobe"
              codesign --force -s - "$DIR/ffmpeg" "$DIR/ffprobe"
              src="https://ffmpeg.martin-riedl.de ($arch, latest release)"
              ;;
          esac
          # osx-x64 is cross-built on arm64 and can't run its ffmpeg; take the version from the download URL (…_9.0.2/ffmpeg.zip).
          if [[ "$RID" == osx-x64 ]]; then ver="ffmpeg ${url##*_}"; ver="${ver%%/*}"; else ver=$("$DIR"/ffmpeg* -version | head -1); fi
          printf 'Bundled FFmpeg: %s\nSource: %s\nFFmpeg is licensed under the GPL; its source code is available at https://ffmpeg.org/download.html\n' \
            "$ver" "$src" > "$DIR/FFMPEG-NOTICE.txt"
          cat "$DIR/FFMPEG-NOTICE.txt"

      - name: Zip (with ffmpeg)
        run: |
          mv "publish/$RID" "publish/$NAME"
          if [[ "$RID" == win-* ]]; then (cd publish && 7z a -tzip "../dist/$NAME-ffmpeg.zip" "$NAME" >/dev/null)
          else (cd publish && zip -qry "../dist/$NAME-ffmpeg.zip" "$NAME"); fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*.zip

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # --target makes gh create the tag on this commit when it doesn't exist yet.
          gh release create "$TAG" dist/*.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SubMatcher $TAG" --generate-notes --notes "$(cat <<'EOF'
          解压即用。带 `-ffmpeg` 的自带 ffmpeg，一般下这个。

          `win-x64` · `linux-x64` · `osx-arm64`（M 系列 Mac）· `osx-x64`（Intel Mac）。macOS 第一次打开被拦的话，对解压出来的文件夹执行 `xattr -cr`。
          EOF
          )"
